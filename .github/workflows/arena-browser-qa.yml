name: Arena responsive browser QA (prototype only, no deploy)

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/core/arena.js'
      - 'src/ui/arena.js'
      - 'src/data/arena-*.js'
      - 'styles/main.css'
      - 'tests/arena-browser-smoke.mjs'
      - '.github/workflows/arena-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime (ephemeral)
        run: npm install --no-save --no-package-lock playwright@1.56.0
      - name: Install headless Chromium dependencies
        run: npx playwright install --with-deps chromium
      - name: Test iPhone SE, iPhone 14 and PC layouts and interactions
        run: node tests/arena-browser-smoke.mjs
