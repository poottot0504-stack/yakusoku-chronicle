name: Publish existing Workers game (manual approval)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '本番公開する場合のみ PUBLISH と入力してください'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: chronicle-existing-workers-production
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require manual production command
        env:
          CONFIRM_TEXT: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM_TEXT" != 'PUBLISH' ]; then
            echo 'Production blocked: type PUBLISH exactly'; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check game JavaScript
        run: node --check src/main.js
      - name: Run game regression tests
        run: node --test tests/*.test.mjs
      - name: Run deploy safety tests
        run: python3 -m unittest discover -s deployment_tests -p 'test_*.py' -v
      - name: Build only public Worker assets
        run: python3 tools/build_worker.py
      - name: Keep the exact tested assets for publish
        uses: actions/upload-artifact@v4
        with:
          name: verified-worker-assets
          path: build/worker/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Read approved release scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download exact tested static build
        uses: actions/download-artifact@v4
        with:
          name: verified-worker-assets
          path: build/worker/
      - name: Check deployed asset tree and fixed Wrangler config
        run: |
          test -f build/worker/index.html
          test -f build/worker/_headers
          test -f build/worker/src/main.js
          test ! -e build/worker/tests
          test ! -e build/worker/__qa_hunt.html
          grep -Fq 'name = "muddy-credit-f5af"' wrangler.toml
          grep -Fq 'workers_dev = true' wrangler.toml
          grep -Fq 'directory = "./build/worker"' wrangler.toml
      - name: Check existing Worker and exact workers.dev host (no writes)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 tools/check_worker_project.py
      - name: Deploy to EXISTING Cloudflare Worker only
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.toml
